spring.application.name=worker-service

server.port=8082

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=worker-group-v2
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.jobplatform.workerservice.model
spring.kafka.consumer.properties.spring.json.value.default.type=com.jobplatform.workerservice.model.Job
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Kafka reliability
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Health information
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka.clients.consumer=INFO

job.service.url=http://localhost:8080

spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
