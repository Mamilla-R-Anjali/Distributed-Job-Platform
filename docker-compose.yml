services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    container_name: job-platform-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    container_name: job-platform-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7
    container_name: job-platform-redis
    ports:
      - "6379:6379"

  job-service:
    build:
      context: ./job-service
    container_name: job-platform-job-service
    depends_on:
      - kafka
      - redis
    ports:
      - "8090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/job_platform
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ARammy1926
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  worker-service:
    build:
      context: ./worker-service
    depends_on:
      - kafka
      - job-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JOB_SERVICE_URL: http://job-service:8080/api/jobs
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: job-platform-api-gateway
    depends_on:
      - job-service
    ports:
      - "8081:8081"
    environment:
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://job-service:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/api/jobs,/api/jobs/**

  frontend:
    build:
      context: ./frontend
    container_name: job-platform-frontend
    depends_on:
      - api-gateway
    ports:
      - "5174:80"
      